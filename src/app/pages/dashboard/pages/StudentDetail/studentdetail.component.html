<div class="card">
  <h5 class="card-header">Fiche étudiant</h5>

  <div class="card-body" *ngIf="errorMessage" data-cy="student-detail-error">
    <p>{{ errorMessage }}</p>
  </div>
  <div class="card-body" *ngIf="student" data-cy="student-detail">
    <div class="row mb-3">
      <div class="col-sm-4 font-weight-bold">ID</div>
      <div class="col-sm-8">{{ student?.id }}</div>
    </div>

    <div class="row mb-3">
      <div class="col-sm-4 font-weight-bold">Prénom</div>
      <div class="col-sm-8">{{ student?.firstName }}</div>
    </div>

    <div class="row mb-3">
      <div class="col-sm-4 font-weight-bold">Nom</div>
      <div class="col-sm-8">{{ student?.lastName }}</div>
    </div>

    <div class="row mb-3">
      <div class="col-sm-4 font-weight-bold">Email</div>
      <div class="col-sm-8">{{ student?.email }}</div>
    </div>

    <div class="row mb-3">
      <div class="col-sm-4 font-weight-bold">Créé le</div>
      <div class="col-sm-8">{{ student?.created_at }}</div>
    </div>

    <div class="row mb-4">
      <div class="col-sm-4 font-weight-bold">Mis à jour le</div>
      <div class="col-sm-8">{{ student?.updated_at }}</div>
    </div>

    <div class="d-flex justify-content-end">
      <button
        type="button"
        (click)="goBack()"
        class="btn btn-secondary mr-2"
        data-cy="student-detail-back"
      >
        Retour
      </button>
      <button
        type="button"
        class="btn btn-primary"
        (click)="goUpdateView()"
        data-cy="student-detail-update"
      >
        Modifier
      </button>
    </div>
  </div>
</div>
