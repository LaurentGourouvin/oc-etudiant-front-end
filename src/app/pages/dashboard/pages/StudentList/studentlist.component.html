<div class="card">
  <h5 class="card-header">Liste des étudiants</h5>

  <div class="card-body">
    <div class="row mb-3">
      <div class="col-md-6">
        <input
          type="text"
          class="form-control"
          placeholder="Rechercher par nom, prénom ou email"
        />
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead class="thead-light">
          <tr>
            <th>#</th>
            <th>Prénom</th>
            <th>Nom</th>
            <th>Email</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let student of students$ | async; index as i">
            <td>{{ i + 1 }}</td>
            <td>{{ student.firstName }}</td>
            <td>{{ student.lastName }}</td>
            <td>{{ student.email }}</td>
            <td class="text-center">
              <button class="btn btn-sm btn-info mr-1">Détail</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div
      *ngIf="(students$ | async)?.length === 0"
      class="alert alert-info mt-3"
    >
      Aucun étudiant trouvé.
    </div>
  </div>
</div>
